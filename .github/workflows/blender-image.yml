# Build and publish ghcr.io/hotspoons/blender, both architectures, each on its OWN native runner.
#
# NATIVE, NOT QEMU. Every other image in this repo builds arm64 under emulation on an amd64 runner,
# which is fine for `npm ci` and hopeless for a C++ project this size: arm64 has no official
# Blender binary, so it compiles from source, and under user-mode emulation that is past GitHub's
# six-hour job limit. `ubuntu-24.04-arm` is a real arm64 machine and is free for public repos.
#
# RARELY. This runs when the pinned version changes (`.devcontainer/blender.env`) or this image's
# own Dockerfile does. The world editor copies `/opt/blender` out of a tag of this image, so its
# own builds take minutes whatever Blender costs to make.
#
# The shape is the documented multi-platform pattern: each runner pushes its platform BY DIGEST,
# and a final job stitches the digests into one tag. Pushing a tag from each runner would have the
# second overwrite the first and leave a single-architecture image under a multi-arch name.
name: Blender image

on:
  push:
    branches: [main]
    paths:
      - 'tools/blender/**'
      - '.devcontainer/blender.env'
      - '.github/workflows/blender-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hotspoons/blender

concurrency:
  group: blender-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    # arm64 compiles Blender; amd64 downloads it. The limit is for the first.
    timeout-minutes: 340
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The source tree, the arm64 precompiled libraries (2.7 GB) and the build tree all live in
      # the builder's storage at once. A stock runner has about fourteen gigabytes free, which is
      # close enough to the line that the toolchains this job does not use are removed first.
      - name: free disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: read the pinned version
        id: v
        run: |
          set -a; . .devcontainer/blender.env; set +a
          echo "version=${BLENDER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${BLENDER_GIT_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_dir=${BLENDER_RELEASE_DIR}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/blender
          file: tools/blender/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BLENDER_VERSION=${{ steps.v.outputs.version }}
            BLENDER_GIT_TAG=${{ steps.v.outputs.tag }}
            BLENDER_RELEASE_DIR=${{ steps.v.outputs.release_dir }}
          # by digest: the merge job below names it
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # NO layer cache export. The intermediate stage is the source tree and the build tree —
          # many gigabytes of nothing worth keeping — and the result IS the image.

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -a; . .devcontainer/blender.env; set +a
          echo "version=${BLENDER_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The VERSION is the tag consumers pin. `latest` is a convenience and nothing depends on it.
      - name: stitch the platforms into one tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:${{ steps.v.outputs.version }} \
            -t ${{ env.IMAGE }}:latest \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: both architectures are really in it, and each one runs
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
          for arch in amd64 arm64; do
            docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.v.outputs.version }} --raw \
              | grep -q "\"architecture\": *\"$arch\"" || { echo "no $arch in the manifest"; exit 1; }
          done
          # amd64 runs here natively; the arm64 half was smoked by its own Dockerfile's final
          # RUN (`blender --version`), which executes on the arm64 runner during the build.
          docker run --rm --platform linux/amd64 ${{ env.IMAGE }}:${{ steps.v.outputs.version }} --version | head -1
