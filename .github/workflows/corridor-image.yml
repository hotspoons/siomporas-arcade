# Build and publish the corridor bake image, both architectures, from one runner.
#
# Unlike the recon image there is nothing to compile: every dependency is a manylinux wheel with
# an arm64 build, so QEMU emulation costs minutes, not hours, and a single buildx invocation emits
# the multi-arch manifest. Runs when tools/corridor changes, or by hand.
name: Corridor image

on:
  push:
    branches: [main]
    paths:
      - 'tools/corridor/**'
      - '!tools/corridor/README.md'
      - '!tools/corridor/chart/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hotspoons/corridor

concurrency:
  group: corridor-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      # TESTED BEFORE IT IS PUBLISHED: the bake's own unit tests, inside the image they will run in
      # (laspy, lazrs, pyproj and shapely as installed there, not as on somebody's laptop). The
      # tests are mounted rather than baked in, so the published image is unchanged.
      - uses: docker/build-push-action@v6
        with:
          context: tools/corridor
          platforms: linux/amd64
          load: true
          tags: corridor:test
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
      - id: unittests
        name: unit tests
        shell: bash
        run: docker run --rm -v "$PWD/tools/corridor/tests:/app/tests:ro" -w /app --entrypoint python corridor:test -m unittest discover -s tests -v 2>&1 | tee ci-unittest.log

      # only the failing tests and their tracebacks, on the run's summary page (scripts/ci-failures.mjs)
      - name: What failed
        if: failure() && steps.unittests.outcome == 'failure'
        run: node scripts/ci-failures.mjs "corridor unit tests" ci-unittest.log >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        with:
          context: tools/corridor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
