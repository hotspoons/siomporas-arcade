# Build and publish the corridor bake image, both architectures, from one runner.
#
# Unlike the recon image there is nothing to compile: every dependency is a manylinux wheel with
# an arm64 build, so QEMU emulation costs minutes, not hours, and a single buildx invocation emits
# the multi-arch manifest. Runs when tools/corridor changes, or by hand.
name: Corridor image

on:
  push:
    branches: [main]
    paths:
      - 'tools/corridor/**'
      - '!tools/corridor/README.md'
      - '!tools/corridor/chart/**'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hotspoons/corridor

concurrency:
  group: corridor-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: tools/corridor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
