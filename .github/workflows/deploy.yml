# Publish each game to its own Cloudflare Worker on a push to main.
#
# The three sites are static: Vite builds them, Wrangler uploads the built files as Worker assets,
# and each Worker claims its own custom domain (see the wrangler.jsonc beside each app). Nothing here
# needs a Cloudflare Pages project, and there is no server code to deploy.
#
# Two repository secrets are required, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN    a token with "Edit Cloudflare Workers", scoped to the account
#   CLOUDFLARE_ACCOUNT_ID   Workers & Pages → the account ID in the right-hand column
#
# The gate below runs the same checks as the lint workflow: nothing ships that does not build clean.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run

  deploy:
    name: ${{ matrix.app }} → ${{ matrix.domain }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # One at a time: a failed upload should not leave half the arcade on a new version.
      max-parallel: 1
      matrix:
        include:
          - app: coast
            domain: radrun.siomporas.com
          - app: stuntin
            domain: stuntin.siomporas.com
          # The old address, kept alive: a Worker that redirects to the new one. Nothing to build.
          - app: drivin-redirect
            domain: drivin.siomporas.com
            build: skip
          - app: conduit
            domain: apex.siomporas.com
    # Secrets cannot be read in an `if:` directly, so they come in as environment variables and the
    # publish step checks those: no credentials yet means build-and-stop rather than a failed run.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.app }}
        if: matrix.build != 'skip'
        run: npm run build -w apps/${{ matrix.app }}
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
      - name: No credentials yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Not published::${{ matrix.app }} built fine, but this repository has no CLOUDFLARE_API_TOKEN secret yet, so nothing was uploaded. See DEPLOY.md."

