# Publish the arcade to Cloudflare on a push to main.
#
# There is one site now — apps/arcade, which mounts all three games — and one Worker behind it.
# The site is static: Vite builds it, Wrangler uploads the built files as Worker assets, and the
# Worker claims arcade.siomporas.com (see apps/arcade/wrangler.jsonc). Nothing here needs a
# Cloudflare Pages project, and there is no server code to deploy.
#
# The one other Worker is a redirect holding an address that predates all this. See DEPLOY.md for
# what to do about apex/stuntin/radrun.siomporas.com, which this no longer publishes anything to.
#
# Two repository secrets are required, both from the Cloudflare dashboard:
#   CLOUDFLARE_API_TOKEN    a token with "Edit Cloudflare Workers", scoped to the account
#   CLOUDFLARE_ACCOUNT_ID   Workers & Pages → the account ID in the right-hand column
#
# The gate below runs the same checks as the lint workflow: nothing ships that does not build clean.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A lockfile written by `npm install` on one architecture describes only that one, and the
      # first thing to fall over is the linter having no binary on the runner. See the script.
      - run: npm run check:lockfile
      - run: npm run lint
      - run: npx tsc -b
      - run: npx vitest run

  deploy:
    name: ${{ matrix.app }} → ${{ matrix.domain }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # One at a time: a failed upload should not leave half the arcade on a new version.
      max-parallel: 1
      matrix:
        include:
          - app: arcade
            domain: arcade.siomporas.com
          # An old address, kept alive: a Worker that redirects into the arcade. Nothing to build.
          - app: drivin-redirect
            domain: drivin.siomporas.com
            build: skip
    # Secrets cannot be read in an `if:` directly, so they come in as environment variables and the
    # publish step checks those: no credentials yet means build-and-stop rather than a failed run.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.app }}
        if: matrix.build != 'skip'
        run: npm run build -w apps/${{ matrix.app }}
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
      - name: No credentials yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice title=Not published::${{ matrix.app }} built fine, but this repository has no CLOUDFLARE_API_TOKEN secret yet, so nothing was uploaded. See DEPLOY.md."

