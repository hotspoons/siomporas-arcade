name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lint + typecheck + test + build
        run: |
          npm ci
          npm run check:lockfile
          npm run lint
          npx tsc -b
          npx vitest run
          # THE SERVICES' OWN TESTS. vitest's projects are apps/* and packages/*, so nothing under
          # tools/ was ever run by CI — the world editor had three suites and has four, and none of
          # them had ever gone red anywhere but on somebody's laptop. A test CI does not run is a
          # test that rots.
          node --test tools/worldeditor/*.test.mjs
          npm run build -ws --if-present
