name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ONE STEP PER CHECK, each keeping its output, so a red run says WHICH check and the last step
      # can put only the failures on the run's summary page (Rich, 2026-10-10, reading CI from a
      # phone: "What do you need from ci when it fails?" — the failing test and its error, not the
      # three thousand lines around it). `shell: bash` is what makes `| tee` keep the exit status:
      # GitHub runs it as `bash -eo pipefail`.
      - name: Install
        run: |
          npm ci
          npm run check:lockfile

      - id: tsc
        name: Typecheck
        shell: bash
        run: npx tsc -b 2>&1 | tee ci-tsc.log

      # vitest also runs the services' node:test suites and oxlint (the `checks` project,
      # tools/ci/), so the run on a laptop before a push is the same run as this one. They were
      # their own steps here and nobody ran them locally, so they went red after every push
      # (Rich, 2026-10-10, the third time of asking: "add them so they are caught locally").
      - id: vitest
        name: vitest (apps, packages, service suites, lint)
        shell: bash
        run: npx vitest run 2>&1 | tee ci-vitest.log

      - id: build
        name: Build
        shell: bash
        run: npm run build -ws --if-present 2>&1 | tee ci-build.log

      - name: What failed
        if: failure()
        shell: bash
        env:
          OUTCOMES: "tsc=${{ steps.tsc.outcome }} vitest=${{ steps.vitest.outcome }} build=${{ steps.build.outcome }}"
        run: |
          for pair in $OUTCOMES; do
            id=${pair%%=*}; outcome=${pair#*=}
            [ "$outcome" = failure ] && node scripts/ci-failures.mjs "$id" "ci-$id.log" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0
