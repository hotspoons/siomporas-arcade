# Build and publish the reconstruction service image for both architectures.
#
# The service (tools/recon-service) compiles four CUDA extensions from source — CuMesh, o-voxel,
# FlexGEMM and nvdiffrast. That is why it runs on Grace-Hopper at all, where TRELLIS 1 cannot:
# nothing here depends on a prebuilt x86 wheel. It also means the build is a real compile.
#
# WHY NATIVE RUNNERS AND NOT QEMU. `platforms: linux/arm64` on an amd64 runner emulates nvcc, which
# is roughly an order of magnitude slower than native and does not finish inside a job. Each
# architecture builds on its own runner and the manifest is stitched afterwards. `ubuntu-24.04-arm`
# is a first-class GitHub runner and free for public repositories.
#
# WHAT ACTUALLY BROKE THE FIRST TIME, since guessing about it wasted an evening: not disk, not the
# cache, not emulation. The Dockerfile had never been built by anyone. `torch` was unpinned, drifted
# onto 2.14 — whose headers require C++20 while CuMesh hard-codes -std=c++17 — and the compile died.
# The image is 7.6GB amd64 / 10.9GB arm64, comfortably inside a runner. The Dockerfile now pins
# torch and ends with a self-check that imports everything it compiled, so this class of failure
# fails the BUILD rather than the deployment.
#
# This does NOT run on every push: the build takes tens of minutes and almost no commit touches it.
# It runs when tools/recon-service changes, or by hand.
name: Recon image

on:
  push:
    branches: [main]
    # `paths` applies to every ref this trigger matches, so a tag filter here would only fire when
    # the tagged commit itself touched these files — usually never. Cut a release build by
    # dispatching this workflow against the tag instead; the tag rule below still names the image.
    # NOT this workflow file. It used to be listed here, so editing a COMMENT in it started a
    # forty-minute image build — and with cancel-in-progress, the next commit killed that build.
    # Ten runs, eight cancelled, and the one marked "failure" was a runner shutdown mid-apt. The
    # build had never actually failed on its merits. Use workflow_dispatch to test changes here.
    paths:
      - 'tools/recon-service/**'
  workflow_dispatch:
    inputs:
      arch_list_amd64:
        description: 'TORCH_CUDA_ARCH_LIST for amd64'
        default: '8.0;8.6;8.9;9.0'
      arch_list_arm64:
        description: 'TORCH_CUDA_ARCH_LIST for arm64'
        default: '9.0'

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hotspoons/recon

concurrency:
  group: recon-image-${{ github.ref }}
  # Queue, do not kill. Cancelling is right for a two-minute site deploy where only the newest commit
  # matters; it is wrong for a forty-minute compile, where an unrelated push half an hour in throws
  # away all of it and reports a failure that never happened.
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
            default_arch_list: '8.0;8.6;8.9;9.0'
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
            default_arch_list: '9.0'
    steps:
      - uses: actions/checkout@v4

      # A CUDA devel base plus four compiled extensions does not fit next to everything GitHub
      # preinstalls. Reclaim the space before starting rather than failing 40 minutes in.
      # A 4.3GB compressed CUDA devel base unpacks to ~11GB, and four compiled extensions on top
      # push the image past 20GB. A stock runner does not have room for that next to everything
      # GitHub preinstalls, so reclaim first — failing here is cheap, failing 40 minutes in is not.
      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache \
                      /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          sudo docker system prune -af --volumes || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: tools/recon-service
          platforms: ${{ matrix.platform }}
          build-args: |
            TORCH_CUDA_ARCH_LIST=${{ (matrix.slug == 'arm64' && (inputs.arch_list_arm64 || matrix.default_arch_list)) || (inputs.arch_list_amd64 || matrix.default_arch_list) }}
          # Push by digest only; the tags are attached to the merged manifest in the next job.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache, not type=gha. This image is north of 20GB unpacked and GitHub's Actions
          # cache is capped at 10GB per repository — `mode=max` there evicts itself at best and
          # fails the step at worst. GHCR has no such cap and the cache lives beside the image.
          # On the very first build this logs `failed to configure registry cache importer: ... not
          # found`, because the cache does not exist yet. It is not fatal — buildkit carries on and
          # writes one — but it reads like an error in the log, so: expected, once.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.slug }},mode=max,image-manifest=true,oci-mediatypes=true
          provenance: false

      - name: Disk after build
        if: always()
        run: df -h / | tail -1

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${GITHUB_SHA}-${{ matrix.slug }}"
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${GITHUB_SHA}-${{ matrix.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Manifest
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=match,pattern=recon-v(.*),group=1
            type=sha,format=short

      # One manifest list pointing at both per-architecture images, so `docker pull` and the Helm
      # chart resolve the right one without anybody naming an architecture.
      - name: Create manifest
        run: |
          cd /tmp/digests
          REFS=""
          for f in *; do REFS="$REFS ${{ env.IMAGE }}@$(cat "$f")"; done
          echo "combining:$REFS"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $REFS

      - name: Show what shipped
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:latest || true
