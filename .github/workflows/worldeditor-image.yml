# Build and publish the worldeditor image, both architectures, from one runner.
#
# THE CONTEXT IS THE REPOSITORY ROOT. The Dockerfile builds `apps/corridor` — which needs
# packages/engine, the workspace lockfile and every workspace manifest — and then copies the
# service beside the built pages, so a context of tools/worldeditor can see none of it.
#
# A change to apps/corridor changes this image, because the image CONTAINS the app. That is the
# trade for the browser knowing one origin, and it is written down here so nobody is surprised
# when an editor change rebuilds a backend.
name: Worldeditor image

on:
  push:
    branches: [main]
    paths:
      - 'tools/worldeditor/**'
      - '!tools/worldeditor/README.md'
      - '!tools/worldeditor/chart/**'
      - 'apps/corridor/**'
      - 'packages/engine/**'
      # The Dockerfile COPIES this in (apps/corridor imports @apex/enginesim for the engine
      # audio), so a change here changes the image. Left out, an enginesim-only commit publishes
      # nothing and the deployed editor quietly keeps the old copy — which is the worst shape a
      # staleness bug can take, because every run is green.
      - 'packages/enginesim/**'
      - 'package-lock.json'
      - '.github/workflows/worldeditor-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/hotspoons/worldeditor

concurrency:
  group: worldeditor-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/worldeditor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # An image that starts but serves no app is the failure this image can actually have, and it
      # would only show the first time somebody opened it. So: start it, and ask it for the page.
      - name: smoke the published image
        run: |
          docker run -d --name worldeditor -p 8780:8780 ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do curl -sf localhost:8780/api/health && break || sleep 1; done
          # Parse the JSON, do not grep it — the response is pretty-printed, so `"ok":true` with
          # no space could never match and would fail the run AFTER the push (assetsvc's lesson).
          curl -sf localhost:8780/api/health | tee /dev/stderr \
            | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if (b.ok !== true) { console.error("health.ok was", b.ok); process.exit(1) }'
          # the three pages are really in there, and `/` really is the world editor
          for p in / /index.html /editor.html; do
            curl -sf "localhost:8780$p" | grep -qi '<html' || { echo "no page at $p"; exit 1; }
          done
          curl -sf localhost:8780/ | grep -q 'worldedit/main' || { echo "/ is not the world editor"; exit 1; }
          # A FRESH IMAGE COMES UP EMPTY, and this used to assert the opposite.
          #
          # It checked `worlds.length > 5`, because the image seeded itself from the repo's
          # sites.json. That is wrong for a deployment: a new volume came up holding thirty-one
          # of somebody else's worlds (Rich, 2026-09-27: "I want to reset the image so it ships
          # with zero built in configs"). A blank world map should mean blank, and the way in is
          # to draw an area or import a bundle.
          curl -sf localhost:8780/api/worlds \
            | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if (b.worlds?.length !== 0) { console.error("a fresh image came up with", b.worlds?.length, "worlds — something is seeding it"); process.exit(1) } console.log("fresh image: 0 worlds, as it should be")'
          # and an import is the way to fill it, which is the half that makes empty usable
          curl -sf -X POST -H 'content-type: application/json' \
            -d '{"kind":"corridor-worlds","worlds":[{"slug":"smoke-world","lat":39.02,"lon":-76.68,"radius_m":900}],"levels":[{"id":"smoke-level","world":"smoke-world","mode":"drive"}]}' \
            localhost:8780/api/worlds/import \
            | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if (!b.imported?.includes("smoke-world") || !b.levels?.includes("smoke-level")) { console.error("import did not take:", JSON.stringify(b)); process.exit(1) } console.log("imported a world and the level set in it")'
          docker rm -f worldeditor

          # THE SEED IS STILL IN THE IMAGE, opt-in rather than gone. If this stops working, the
          # chart's `seedSites` value points at a path that is no longer there and would fail on
          # somebody's cluster instead of here.
          docker run -d --name worldeditor-seeded -p 8781:8780 \
            -e WORLDEDITOR_SEED_SITES=/app/tools/corridor/sites.json ${{ env.IMAGE }}:latest
          for i in $(seq 1 30); do curl -sf localhost:8781/api/health >/dev/null && break || sleep 1; done
          curl -sf localhost:8781/api/worlds \
            | node -e 'const b=JSON.parse(require("fs").readFileSync(0,"utf8")); if (!(b.worlds?.length > 5)) { console.error("seeding is opt-in but opting in gave", b.worlds?.length, "worlds"); process.exit(1) } console.log("opting in still seeds", b.worlds.length, "worlds")'
          docker rm -f worldeditor-seeded
