# Publish the reconstruction service image to Harbor.
#
# This mirrors the fighter pipeline's image→3D half (tools/recon-service) and nothing else — the
# site itself still ships from GitHub Actions to Cloudflare. GitLab is here for one reason: the
# image is a real CUDA build, and it needs native runners per architecture and disk to match.
#
# WHY NOT GITHUB ACTIONS. The image compiles four CUDA extensions from source (CuMesh, o-voxel,
# FlexGEMM, nvdiffrast) and lands north of 20GB unpacked. Emulating nvcc under QEMU to reach arm64
# is roughly an order of magnitude slower than native and does not finish inside a job. The
# docker-build component here runs one job per architecture on `${TARGETARCH}-runner` and stitches
# the manifest afterwards, which is exactly the shape this needs.
#
# WHERE IT PUBLISHES. `sandbox`, deliberately — this is a personal project and has no business in a
# production repository. Feature branches and merge requests go to sandbox-snapshots on their own,
# via the component's rules.
#
# REQUIRED CI VARIABLES (set at the group level for the other projects here; confirm they resolve
# for this one before wondering why the push 401s):
#   HARBOR_HOST  HARBOR_USERNAME  HARBOR_PASSWORD   the registry and a robot account that can
#                                                   push to sandbox/*
#   CICD_PIPELINE_RESOURCES                         group path holding the cicd-components
#                                                   projects; falls back below if unset

workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_TAG"
      when: always
    - when: never

variables:
  # Overridable so the include below still resolves if the group variable is not inherited here.
  CICD_PIPELINE_RESOURCES: "patapsco-ai-labs/central-tech"

stages:
  - semver
  - build

include:
  - component: $CI_SERVER_FQDN/$CICD_PIPELINE_RESOURCES/cicd-components/simple-version@v1
    inputs:
      version-file: ".version"
  - component: $CI_SERVER_FQDN/$CICD_PIPELINE_RESOURCES/cicd-components-docker/docker-build@v3
    inputs:
      repository: "sandbox"
      repository-snapshots: "sandbox-snapshots"
      image-name: "recon"
      dockerfile: "$CI_PROJECT_DIR/tools/recon-service/Dockerfile"
      context: "$CI_PROJECT_DIR/tools/recon-service"
      description: "TRELLIS.2 image-to-3D as a service, for the fighter asset pipeline"
      target-archs: [amd64, arm64]
      # Which GPU architectures nvcc emits for. Every one is a separate device-code pass over the
      # same sources, so this is the single biggest lever on build time. arm64 here is Grace-Hopper
      # and nothing else; amd64 spans Ampere to Hopper. CUDA 13 dropped Maxwell, Pascal and Volta,
      # so sm_60 is not reachable from this base at any setting — see the Dockerfile.
      extra-params: >-
        --opt build-arg:TORCH_CUDA_ARCH_LIST=9.0

set-version:
  extends: .set-simple-version

# The image takes tens of minutes and almost no commit touches it. Build it when it changes, on a
# tag, or by hand — never on every push.
build-docker:
  rules:
    - if: "$CI_COMMIT_TAG"
      when: on_success
    - changes:
        - tools/recon-service/**/*
        - .gitlab-ci.yml
      when: on_success
    - when: manual
      allow_failure: true
