<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>corridor</title>
    <link rel="preload" href="/fonts/ibm-plex-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/ui/ui.css" />
    <link rel="stylesheet" href="/src/ui/app.css" />
  </head>
  <body>
    <!-- The interface is built in src/ui/viewer.ts. What is left in this file is the canvas and
         the two touch pads, which exist only on a phone and need no JavaScript to lay out. -->
    <canvas id="gl"></canvas>

    <div class="drivepad" id="drivepad">
      <button data-act="drive" aria-label="drive">drive</button>
      <button data-act="faster" aria-label="faster">+</button>
      <button data-act="slower" aria-label="slower">−</button>
      <button data-act="photo" aria-label="to the photo">◎</button>
    </div>

    <!-- phone: move about the world in orbit mode. Hold to glide in the camera's horizontal frame;
         ⤒/⤓ up and down, ▲/▼ forward and back, ◀/▶ sideways. In drive mode ▲/▼ are speed. -->
    <div class="movepad" id="movepad">
      <button data-move="up" aria-label="up">⤒</button>
      <button data-move="fwd" aria-label="forward">▲</button>
      <button data-move="down" aria-label="down">⤓</button>
      <button data-move="left" aria-label="left">◀</button>
      <button data-move="back" aria-label="back">▼</button>
      <button data-move="right" aria-label="right">▶</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
