# The world editor on gh200-1.
#
# The WHOLE input to this release. Not a patch over what is already there.
enabled: true
fullnameOverride: worldeditor

image:
  # Pinned. `latest` would make "what is deployed" depend on when the pod last restarted.
  tag: sha-e70a318

ingress:
  enabled: true

# Ours first, then the public mirrors. Each carries the box it actually holds — a regional
# instance answers a query about somewhere else with HTTP 200 and zero ways, which is
# indistinguishable from "no roads here", so the coverage box is what stops that being believed.
#
# overpass-na (Geofabrik north-america: the US, Canada, Mexico, Greenland) was deployed on
# 2026-09-27 and never added here, so everything in North America outside the Maryland box went to
# the public mirrors — minutes per tile, or a 406 (Rich's Maine view, 2026-09-30: one fragment of
# US 1 after several minutes). From our own it is 447 Bar Harbor roads in 129 ms. Maryland stays
# on `overpass` first; the NA box is drawn a little inside the extract so an edge query falls to
# the mirrors rather than being told "nothing here" by a server that does not hold it.
overpassUrl: "http://overpass-eu/api/interpreter#34/-25/72/45,http://overpass/api/interpreter#37.9/-79.5/39.8/-75.0,http://overpass-na/api/interpreter#14.5/-179.9/83.5/-12"

# Count free GPUs to size a splat run's fan-out. A CLUSTER-scoped read of nodes and of pods in
# every namespace — wider than anything else this chart asks for, which is why it is opt-in.
# Without it the editor reports that it could not ask, rather than reporting zero.
gpuVisibility: true

# The Deploy panel's Cloudflare token. A token typed into the panel is forgotten whenever this
# release rolls; to keep one, create the Secret once and name it here:
#   kubectl -n default create secret generic cloudflare --from-literal=CLOUDFLARE_API_TOKEN=<token>
# cloudflare:
#   secretName: cloudflare

# Ships empty. A blank world map means blank; worlds arrive by being drawn or imported.
seedSites: ""

data:
  # NAMED HERE, NOT IN THE CHART. The chart deliberately names no storage class so the cluster's
  # own default applies anywhere — but THIS cluster's claim already exists and was created on
  # ceph-filesystem, and a PVC's spec is immutable after creation. Omitting it made helm try to
  # patch the claim to no class at all and the upgrade was refused:
  #
  #   PersistentVolumeClaim "worldeditor-data" is invalid: spec: Forbidden: spec is immutable
  #
  # Which is the division of labour working correctly: the chart stays portable, and the file
  # that describes one cluster records what that cluster actually has.
  storageClass: ceph-filesystem

splat:
  # RWX IS NOT OPTIONAL, and this cluster's DEFAULT class cannot do it. `ceph-block` / `ceph-rbd`
  # are RBD, which is ReadWriteOnce; the fallback runner tiers' output volume is shared by a head
  # and its workers, so it needs CephFS. Left to the default it would sit Pending for ever — the
  # same failure the missing claim had, one layer down. (TrainingDeployment is installed here, so
  # `auto` picks that and this only matters when a run is pinned to jobset or batch.)
  storageClass: ceph-filesystem

# The live headless Blender, supervised by the pod: the rigging pipeline and MCP clients drive it.
blender:
  autostart: true
