<!doctype html>
<!--
  Fixture for scripts/verify-browser.mjs. Not a demo and not something to open by hand: it exists so
  a headless Chromium can answer the one question a Node probe cannot, which is whether Emscripten's
  glue survives inside a real AudioWorkletGlobalScope — a scope with no fetch, no document and, in
  Chrome, no `performance`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>enginesim verification</title>
  </head>
  <body>
    <pre id="log">starting</pre>
    <script type="module">
      import { EngineSim } from '../src/index.ts'

      const log = (message) => {
        document.getElementById('log').textContent += `\n${message}`
      }

      // Copies whatever reaches it into a buffer the page can read back. Lives here rather than in
      // the package because it is a measuring instrument, not part of the engine.
      const CAPTURE = `
        class Capture extends AudioWorkletProcessor {
          constructor() {
            super()
            this.chunks = []
            this.port.onmessage = () => {
              const total = this.chunks.reduce((n, c) => n + c.length, 0)
              const out = new Float32Array(total)
              let at = 0
              for (const c of this.chunks) { out.set(c, at); at += c.length }
              this.port.postMessage(out, [out.buffer])
              this.chunks = []
            }
          }
          process(inputs) {
            const input = inputs[0]
            if (input && input[0]) this.chunks.push(new Float32Array(input[0]))
            return true
          }
        }
        registerProcessor('capture', Capture)
      `

      window.runVerification = async ({ script, rpm, seconds }) => {
        const context = new AudioContext({ sampleRate: 48000 })
        await context.resume()
        log(`context ${context.sampleRate} Hz, state ${context.state}`)

        await context.audioWorklet.addModule(
          URL.createObjectURL(new Blob([CAPTURE], { type: 'text/javascript' })))
        const capture = new AudioWorkletNode(context, 'capture',
          { numberOfInputs: 1, numberOfOutputs: 0 })

        const errors = []
        const engine = await EngineSim.create(context, { onError: (e) => errors.push(e) })
        log('worklet ready — wasm instantiated inside the audio thread')

        // THE CONTROL. Nothing loaded yet, so this stretch must be silent. It is what makes the
        // "there is sound" assertion below mean something.
        engine.connect(capture)
        await new Promise((r) => setTimeout(r, 300))
        const silence = await new Promise((resolve) => {
          capture.port.onmessage = (event) => resolve(event.data)
          capture.port.postMessage('drain')
        })

        const profile = await engine.load(script)
        log(`loaded ${profile.name}, ${profile.cylinders} cylinders`)

        engine.drive(rpm, 0.5, 0.001)
        await new Promise((r) => setTimeout(r, 700)) // settle the leveler and convolution tail
        await new Promise((resolve) => {
          capture.port.onmessage = () => resolve()
          capture.port.postMessage('drain')
        })

        await new Promise((r) => setTimeout(r, seconds * 1000))
        const audio = await new Promise((resolve) => {
          capture.port.onmessage = (event) => resolve(event.data)
          capture.port.postMessage('drain')
        })

        const measured = engine.telemetry
        await context.close()
        return {
          sampleRate: 48000,
          profile,
          errors,
          telemetry: measured,
          silencePeak: silence.reduce((m, v) => Math.max(m, Math.abs(v)), 0),
          silenceSamples: silence.length,
          audio: Array.from(audio.subarray(0, 48000)),
          audioSamples: audio.length,
          audioPeak: audio.reduce((m, v) => Math.max(m, Math.abs(v)), 0),
          audioRms: Math.sqrt(audio.reduce((s, v) => s + v * v, 0) / Math.max(1, audio.length)),
        }
      }

      log('ready')
      window.verificationReady = true
    </script>
  </body>
</html>
