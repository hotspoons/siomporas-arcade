{{- if and .Values.enabled .Values.httpRoute.enabled }}
# Gateway API. See values.yaml for WHY this is written against pai-managed-ext-gateway rather than
# central-gateway: the latter is a ClusterIP, so a route there gets a DNS record nobody off-cluster
# can reach — the trap the recon chart documented after falling into it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "assetsvc.fullname" . }}
  labels: {{- include "assetsvc.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      timeouts:
        request: {{ .Values.httpRoute.timeout }}
        backendRequest: {{ .Values.httpRoute.timeout }}
      backendRefs:
        - name: {{ include "assetsvc.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
