{{- if and .Values.enabled .Values.ingress.enabled }}
# ingress-nginx. On gh200-1 this is the path that actually works from a laptop on the network:
# it has a MetalLB address on the same 172.16.10.0/24 the platform's hostnames resolve to,
# external-dns lists --source=ingress, and cert-manager solves DNS-01 through Cloudflare, so a
# private address still gets a real certificate.
#
# Turn on EITHER this or httpRoute, never both: external-dns publishes whichever object carries
# the hostname, and two objects claiming one name fight over the record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "assetsvc.fullname" . }}
  labels: {{- include "assetsvc.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "assetsvc.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
