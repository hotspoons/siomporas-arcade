{{- if or .Values.bake.enabled .Values.publish.enabled }}
{{- if .Values.bake.sitesJson }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "corridor.fullname" . }}-sites-{{ .Release.Revision }}
  labels: {{- include "corridor.labels" . | nindent 4 }}
data:
  sites.json: {{ .Values.bake.sitesJson | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  # One Job per release revision: `helm upgrade` is how you say "bake again".
  name: {{ include "corridor.fullname" . }}-{{ .Release.Revision }}
  labels: {{- include "corridor.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.bake.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.bake.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "corridor.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: corridor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              {{- if and .Values.bake.enabled (not .Values.publish.only) }}
              python -m corridor fetch {{ .Values.bake.sites }}{{ if .Values.bake.skip }} --skip {{ .Values.bake.skip }}{{ end }}{{ range .Values.bake.args }} {{ . }}{{ end }}
              python -m corridor report
              {{- end }}
              {{- if .Values.publish.enabled }}
              python -m corridor publish {{ .Values.bake.sites }} --prefix "$CORRIDOR_S3_PREFIX"
              {{- end }}
          env:
            - name: CORRIDOR_DATA
              value: /data
            - name: CORRIDOR_HORIZON_M
              value: {{ .Values.horizonRadiusM | quote }}
            {{- if .Values.bake.sitesJson }}
            - name: CORRIDOR_SITES
              value: /config/sites.json
            {{- end }}
            {{- if .Values.publish.enabled }}
            - name: CORRIDOR_S3_BUCKET
              value: {{ .Values.publish.bucket | quote }}
            - name: CORRIDOR_S3_ENDPOINT
              value: {{ .Values.publish.endpoint | quote }}
            - name: CORRIDOR_S3_REGION
              value: {{ .Values.publish.region | quote }}
            - name: CORRIDOR_S3_PREFIX
              value: {{ .Values.publish.prefix | quote }}
            {{- end }}
          {{- if .Values.publish.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.publish.secretName }}
          {{- end }}
          resources: {{- toYaml .Values.bake.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.bake.sitesJson }}
            - {name: sites, mountPath: /config, readOnly: true}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "corridor.claimName" . }}
        {{- if .Values.bake.sitesJson }}
        - name: sites
          configMap:
            name: {{ include "corridor.fullname" . }}-sites-{{ .Release.Revision }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
