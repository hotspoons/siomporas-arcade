# Overpass API on gh200-1. The public mirrors 504 under load and went down entirely for an hour on
# 2026-09-21, failing every new site bake at step one; this is the fix Rich asked for.
#
# The region is a Geofabrik extract. Maryland inits in ~20 minutes and covers every Gambrills /
# Crownsville / Davidsonville / Bowie / Frederick / Sideling corridor we bake. To cover the
# California, Oregon and Maine sites too, set planetUrl/diffUrl to north-america/us-latest and
# raise storage to 400Gi — that init is several hours, so do it deliberately, not by accident.
image:
  repository: wiktorn/overpass-api
  tag: "latest"       # multi-arch; arm64 present, which the GH200 nodes need
  pullPolicy: IfNotPresent

fullnameOverride: overpass

# Geofabrik publishes .osm.pbf only (the .osm.bz2 the image expects 404s), so the container
# downloads the pbf into planet.osm.bz2 and osmium converts it in place before the clone.
# A dated file rather than -latest, though not for the reason this comment used to give: the
# entrypoint downloads with `curl -L` and DOES follow the 302, and europe-latest.osm.pbf fetched
# fine. Pinning the init snapshot is still worth it for reproducibility, and updates come from
# diffUrl anyway, so it costs nothing.
planetUrl: https://download.geofabrik.de/north-america/us/maryland-260920.osm.pbf
preprocess: 'mv /db/planet.osm.bz2 /db/planet.osm.pbf && osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf && rm /db/planet.osm.pbf'
diffUrl: https://download.geofabrik.de/north-america/us/maryland-updates/
# `no` drops changeset/user/timestamp: a third off the database and we never query on them
meta: "no"
# minutely diffs are pointless for a bake of roads that have been there for decades
updateSleep: 86400
rulesLoad: 10

# AREAS OFF, and rulesLoad does NOT do this. `OVERPASS_USE_AREAS=true` is baked into the image,
# so leaving this unset means areas run however low rulesLoad is; rulesLoad only sets the loop's
# interval. On 2026-09-24 that cost the Europe import 33 hours: the database imported clean and
# caught up on diffs, then the entrypoint's one-shot "Generating areas..." died with
#
#   File_Error: Invalid argument 22 /db/db/area_tags_local.bin File_Blocks::read_block::4
#
# because the areas step is the ONE call that does not pass --compression-method, so it writes
# lz4 whatever `compression` says. Measured, not inferred — the method is a uint16 in the .idx
# header and it reads 0 (none) for nodes.bin and ways.bin, 2 (lz4) for every area_*.bin. lz4 is
# the codec already proven to fail on this storage by the clone gate. The failure broke the
# entrypoint's && chain before `touch /db/init_done`, so the container exited 1, restarted, found
# no marker and began re-importing Europe from zero on top of a finished database.
#
# We query by bbox and have never used an area filter. Turning this on needs `compression` to
# stop being `no`, which is not available here.
useAreas: false
# the dispatcher's shared memory; Overpass wants this in /dev/shm
shmSize: 2Gi

# GB of flush buffer during import. The image defaults to 16, which is a planet-sized
# setting and sits right on our 16Gi memory limit; the import died in "Reorganizing the
# database" with an EINVAL out of File_Blocks::read_block on a CLEAN volume, which is what
# a failed buffer allocation looks like through an O_DIRECT read. O_DIRECT itself was
# tested on this volume at 512 and 4096 byte alignment and works.
flushSize: 4

# Block compression for the imported database: gz (image default), lz4 or no.
compression: "no"

storage:
  size: 60Gi
  # CORRECTED 2026-09-22: this comment used to say the database must be on a block device because
  # the cephfs clone died with "File error caught: 22 /db/db/nodes.bin". That is the same errno,
  # the same function and the same phase as the failure now attributed to compression — it failed
  # on cephfs WITH gz, and gz was the cause. Settled by test: a Maryland import on 80Gi
  # ceph-filesystem with compression=no reached the serving phase and answered a Crofton bbox with
  # 508 ways, the same number ceph-block gives. Europe then imported 254 GB onto 4Ti cephfs with
  # zero occurrences of the error across 33 hours.
  # ceph-block is kept here only because this release is already on it; cephfs is fine.
  className: ceph-block

resources:
  requests: { cpu: "2", memory: 6Gi }
  limits: { cpu: "8", memory: 16Gi }

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  host: overpass.richard-siomporas.basedweights.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    # a corridor query over a 12 km network bbox is big and slow; nginx's defaults are not
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    secretName: overpass-tls

# The road not taken, again (see tools/recon-service/README.md): the platform's
# pai-managed-ext-gateway at 172.16.10.157 is the intended external front door. This chart uses
# ingress-nginx because that is what recon proved on this cluster.
nodeSelector: {}
tolerations: []
