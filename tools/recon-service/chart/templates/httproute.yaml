{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "recon.fullname" . }}
  labels: {{- include "recon.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      # A reconstruction is tens of seconds and the default gateway timeout is well under that.
      timeouts:
        request: {{ .Values.httpRoute.timeout }}
        backendRequest: {{ .Values.httpRoute.timeout }}
      backendRefs:
        - name: {{ include "recon.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
