{{- if and .Values.enabled .Values.httpRoute.enabled }}
# The road not taken so far, kept because it is the intended one. `pai-managed-ext-gateway`
# (172.16.10.157) is the address every public platform hostname resolves to; `central-gateway` is a
# ClusterIP, so an HTTPRoute there gets a DNS record nobody off-cluster can route to — the trap
# tools/recon-service documented after falling into it. This stays off until someone works out how
# a non-platform hostname gets its certificate there. Exactly one of this and ingress may be on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "worldeditor.fullname" . }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "worldeditor.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
