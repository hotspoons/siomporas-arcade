{{- if and .Values.enabled .Values.ingress.enabled }}
# ingress-nginx, which is the path that actually works on gh200-1: a MetalLB address on the same
# 172.16.10.0/24 the platform's hostnames resolve to, external-dns listing --source=ingress, and
# cert-manager solving DNS-01 through Cloudflare so a private address still gets a real certificate.
#
# Turn on EITHER this or httpRoute, never both: external-dns publishes whichever object carries the
# hostname, and two objects claiming one name fight over the record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "worldeditor.fullname" . }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
  annotations: {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "worldeditor.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
