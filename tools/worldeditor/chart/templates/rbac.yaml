{{- if .Values.enabled }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "worldeditor.fullname" .) }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.rbac.create }}
---
# THE SMALLEST THING THAT WORKS. A Role, not a ClusterRole: this pod has no business outside its
# own namespace. It can create, watch and delete a Job, and read a pod's log — which is exactly
# "start a bake and show me what it is doing" and nothing else. It cannot read a Secret (the
# bucket credentials reach the bake Job through envFrom, which the API server resolves, not this
# process), cannot touch a Deployment, and cannot reach another namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "worldeditor.fullname" . }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Model discovery (models.mjs): which inference deployments are Ready, and what Services they
  # brought up. READ ONLY, and list/get only -- the editor never changes a model deployment, it
  # only needs to find out where flux is today rather than carry a hostname in a file.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  # The GROUP, not the CRD names. A CRD is called `<plural>.<group>` and putting that whole string
  # in apiGroups grants nothing, silently.
  - apiGroups: ["richard-siomporas.patapsco.ai"]
    resources: ["inferencedeployments"]
    verbs: ["get", "list"]
  # and the training runs this service creates and watches
  - apiGroups: ["richard-siomporas.patapsco.ai"]
    resources: ["trainingdeployments"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "worldeditor.fullname" . }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "worldeditor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (include "worldeditor.fullname" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
