{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "worldeditor.fullname" . }}
  labels: {{- include "worldeditor.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "worldeditor.selectorLabels" . | nindent 4 }}
{{- end }}
