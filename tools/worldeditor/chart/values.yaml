# worldeditor: the pod where a person turns OSM into a corridor world.
#
# OFF BY DEFAULT, and that is the point twice over. Nothing in corridor requires this — the viewer
# and the editor work exactly as before without it — and a pod that can create Jobs on a shared
# cluster is something you turn on deliberately, not something that arrives with a merge.
#
#   helm upgrade --install worldeditor tools/worldeditor/chart -n default \
#     --set enabled=true --set ingress.enabled=true
#
# That one command is the whole deployment: it makes the volume, the pod, the role that lets a
# person start a bake without a kubeconfig, and the route in. Nothing has to be installed first
# and no bake runs on install — you draw the areas and bake them from the page.
#
# `helm template` with these defaults renders ZERO objects.
enabled: false

image:
  repository: ghcr.io/hotspoons/worldeditor
  tag: "latest"
  pullPolicy: Always

# A BLANK WORLD MAP MEANS BLANK. Empty is the default and a populated editor is a choice.
#
# The image used to come up holding thirty-one Maryland corridors — somebody else's worlds on
# somebody else's fresh volume. The way in is to draw an area or import a definition, not to
# inherit a list (Rich, 2026-09-27: "I want to reset the image so it ships with zero built in
# configs and we can start by importing crofton or crownsville or arrowhead").
#
# The list is still IN the image, so opting back in is a flag rather than a rebuild:
#   --set seedSites=/app/tools/corridor/sites.json
# It only ever applies to a volume with no worlds on it; it cannot overwrite what you have.
seedSites: ""

replicaCount: 1

# THE BAKE'S VOLUME. A bake Job writes `sites/<slug>/web/`, this pod serves it, and the editor
# writes `sites/<slug>/placements.json` beside it. Nothing is copied. RWX because a bake Job and
# this pod hold it at the same time, which is the normal state, not the exception.
#
# LEAVE `existingClaim` EMPTY unless you are sharing a volume with a separately-installed
# `tools/corridor/chart`. The bake Jobs this service launches mount WORLDEDITOR_CLAIM, which the
# deployment sets to whatever claim this chart is using — so a claim of its own is not a half
# setup, it is the self-contained one, and the pod and its bakes are on the same volume either
# way. Set `existingClaim` only to ADOPT an existing bake volume; the two-worlds problem it avoids
# is the corridor chart's Job writing somewhere this pod cannot see, which only arises if you run
# that chart's Job at all.
#
# The claim carries `helm.sh/resource-policy: keep`, so worlds outlive `helm uninstall`.
data:
  existingClaim: ""
  size: 500Gi
  # EMPTY MEANS THE CLUSTER'S OWN DEFAULT, which is what its admin has already decided. A named
  # class is one cluster's name for it: on anybody else's the PVC stays Pending forever with a
  # message nobody reads (Rich, 2026-09-28: "no binding to cephfs as well ... needs to be generic
  # for all deployments not to overfit our cluster"). Set it only if you mean a specific one.
  storageClass: ""
  # ReadWriteMany IS REQUIRED, and it is the one storage property this really does need: a bake
  # Job writes the world while this pod serves it, and a splat run has a leader and N workers
  # sharing one output directory. Not every default StorageClass provides RWX — `just preflight`
  # checks, because the failure is a Pod stuck Pending rather than an error anyone is shown.
  accessMode: ReadWriteMany

# Ours first. The public mirrors are appended by the service itself, exactly as osm.py does, so a
# site outside our extract still bakes.
overpassUrl: https://overpass.richard-siomporas.basedweights.com/api/interpreter

# WHAT EACH INSTANCE ABOVE HOLDS, by Geofabrik region id: `overpass=us/maryland,
# overpass-na=north-america` (several on one: `overpass=us/maryland+us/virginia`). Routing is by the
# extract's own outline, read from the Geofabrik index (tools/worldeditor/coverage.mjs). An instance
# left out here, with no `#s/w/n/e` box on its URL either, is treated as holding the whole planet —
# right for a planet instance, and the silent empty for a regional one. Regions added by an
# osm-import are kept on the volume whatever this says.
overpassRegions: ""

# The image an osm-import Job runs in: the Overpass instances' own (it carries curl, osmium and
# pyosmium). Empty uses the editor's default, wiktorn/overpass-api:latest; pin the digest the
# instances run.
osmImportImage: ""

# The asset backend, in-cluster. The BROWSER never sees this: the service reverse-proxies it at
# /assetsvc so the page knows one origin. Empty means the asset panels report "no service", which
# is a normal state — generation is off by default (tools/assetsvc/chart).
assetsvcUrl: http://assetsvc.default.svc

bake:
  # What a bake Job runs. The same image tools/corridor/chart uses, because it IS that Job.
  image: ghcr.io/hotspoons/corridor:latest
  # A site is ~100 M points held in numpy while rasters are built; 16 Gi is the observed floor.
  #
  # A BIG NETWORK IS THE HARD CASE, and bake 495 is the proof. 495 is the Capital Beltway
  # `kind: network` world (514 km², 10,138 chains); it keeps EVERY near-road return for the
  # structure tests, so `lidar/corridor.laz` alone is 669,055,397 points (3.5 GB compressed).
  #
  # 48 Gi died in the lidar ASSEMBLY just before corridor.laz was written (all 643 tiles and their
  # VRTs already on disk). That is cut at the source now: network_tiles.lidar_tiled drops the tile
  # accumulators once the VRTs exist, assembles the near-road cloud in one preallocated block and
  # frees each batch behind it, so the peak is ~1x the cloud rather than ~2x it plus the tiles.
  #
  # 128 Gi got PAST lidar and died in `surface.measure`, which read all 669 M points and built a
  # shapely Point object for every ground return: measured at ~240 bytes per point, ~150 GiB worst
  # case before laspy's own ~20 GiB of records. That is fixed at the source now — surface.measure
  # indexes the spine and projects points in numpy chunks (a few GB, and 3 h -> minutes) and the
  # branch profiles group the cloud once instead of rescanning it per chain — so the memory limit
  # has real headroom again rather than being the unblock.
  #
  # CPU IS THE OTHER HALF. The bake was single-threaded through its two longest stages (10,137
  # branch profiles, then surface.measure): ~71 of these nodes' 72 cores sat idle for ~9 h. Those
  # offline stages now run in a FORKED pool sized by CORRIDOR_JOBS (default min(cpu_count, 32)) —
  # forked so the 669 M-point cloud is inherited copy-on-write, not pickled per task — so the CPU
  # limit is raised to match. 384 GiB / 64 CPU fit a 573 GiB, 72-core node, and no LimitRange or
  # ResourceQuota caps this namespace; the request stays small so a bake still schedules beside the
  # editor and other work.
  resources:
    requests: {cpu: "8", memory: 32Gi}
    limits: {cpu: "64", memory: 384Gi}
  # keep a week of finished Jobs, so a log is still readable the next morning
  ttlSecondsAfterFinished: 604800
  horizonRadiusM: 30000

# Publishing runs `python -m corridor publish` in a Job with this Secret attached.
#   kubectl create secret generic corridor-r2 --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
# The Deploy panel's Cloudflare token, from a Secret with the key CLOUDFLARE_API_TOKEN:
#   kubectl create secret generic cloudflare --from-literal=CLOUDFLARE_API_TOKEN=<token>
# Empty: the token is typed into the panel and held in memory until the pod restarts.
cloudflare:
  secretName: ""

publish:
  bucket: ""
  endpoint: ""      # R2: https://<account-id>.r2.cloudflarestorage.com ; empty for AWS
  region: auto
  prefix: corridor
  secretName: corridor-r2

# THE SMALLEST ROLE THAT WORKS, and the reason it exists is that a person should be able to start a
# bake without a kubeconfig. Namespaced, no secrets, no cluster scope, and the only thing it can
# create is a Job. `pods/log` is `get` — that is the log the editor streams.
rbac:
  create: true
serviceAccount:
  create: true
  name: ""

corsOrigin: "*"    # the app is served from this same origin in the cluster; this is for curl

service:
  port: 80

probes:
  startupPeriodSeconds: 2
  startupFailureThreshold: 30

# RAISED FOR BLENDER, 2026-09-29. The service alone is a few hundred megabytes; the pod now also
# runs a live headless Blender that holds a whole scene between calls, and the riggers each start
# another. A 250k-vertex character head OOM-killed the bridge three times at a few gigabytes on a
# dev box, so 2Gi would mean the rigging pipeline dies on its first real asset. gh200-1's nodes have
# 480 GB; the request stays small so an idle editor reserves little.
resources:
  requests: {cpu: "500m", memory: 2Gi}
  limits: {cpu: "8", memory: 24Gi}

# The live headless Blender this editor supervises: started with the pod, restarted if it dies, and
# its last exit reported in the Blender tab. Settable in the editor too.
blender:
  autostart: true

# Turn on EITHER ingress or httpRoute, never both: external-dns publishes whichever object carries
# the hostname and two objects claiming one name fight over the record. The nginx Ingress is the
# proven path on gh200-1 (see tools/overpass and tools/recon-service); central-gateway is a
# ClusterIP, so an HTTPRoute there gets a DNS record nobody off-cluster can route to.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    # A world's manifest is megabytes of JSON and a bake log is long-lived; nginx's defaults are not.
    #
    # THIS NUMBER AND THE SERVER'S OWN CAP HAVE TO AGREE. The service accepts an uploaded baked
    # world up to WORLDEDITOR_ARCHIVE_MAX_MB (1536 MiB), and this used to say 64m — so importing a
    # real world through the ingress died at the proxy, twenty-four times earlier than the limit
    # the service declares and reports. `0` turns nginx's body check off entirely and lets the
    # service be the single place that says no, with a message that explains itself. Capture
    # uploads are already chunked below this (see /api/uploads/limits), so the only thing that
    # relies on it is the archive import.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: worldeditor.richard-siomporas.basedweights.com
      paths: [{path: /, pathType: Prefix}]
  tls:
    - secretName: worldeditor-tls
      hosts: [worldeditor.richard-siomporas.basedweights.com]

httpRoute:
  enabled: false
  parentRef:
    name: pai-managed-ext-gateway
    namespace: pai-managed
  hostnames: []

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# The splat bake, when a capture is trained into a gaussian world.
splat:
  # The image the run uses. Multi-arch; nothing here pins an architecture.
  image: ghcr.io/hotspoons/gaussworks:latest
  # THE BAKE CONFIG, settled by experiment by the splats lane: survey resolution with
  # `cell_m: 120`, and since 2026-09-30 `poses.order: global` — the whole capture is solved
  # ONCE, pulled onto the GPS with a weak prior, then cut into cells (gaussworks
  # docs/SCALING-JOURNAL.md entry 5). Partition-first put 20 of 47 seams over 3 m on this
  # neighbourhood; one model cuts at 0.02 m, and the cells score level with partition-first on
  # the same held-out frames. Everything that changed lives in this file: the order, the GPS
  # prior, the camera and point rules. The runner's command line did not change. The path is
  # inside the image (`COPY . /opt/splatpipe`), so it travels with the code that reads it.
  config: /opt/splatpipe/configs/arrowhead-c120.yaml
  # Worst acceptable seam, in metres. Under a partition-first config neighbouring chunks are
  # levelled independently and can disagree about the height of the same road, and run.py
  # refuses to train past this bar. Under `poses.order: global` the chunks share one model and
  # cannot disagree, so the gate is ADVISORY there: measured, written to seam-gate.json with
  # "advisory": true, never a failure. The check that CAN fail a global world is the residual
  # against the GPS after the prior refine, which run.py prints.
  seamFailOver: 3.0
  # The commit the job must find on the volume, when the code lives there rather than in the
  # image. Empty means no check — and a job running stale code does not fail, it succeeds and
  # hands back a plausible wrong number, so set this whenever the PVC path is in use.
  codeSha: ""
  # WHICH RUNNER, in Rich's order of preference (2026-09-29): a Patapsco AI TrainingDeployment if
  # the CRD is installed, else a JobSet, else plain Jobs — a head and its workers. `auto` asks the
  # cluster each time; `training`, `jobset` or `batch` pins one, for when the featured path is
  # misbehaving and you need to know whether it is the operator or the workload.
  runner: auto
  # The entrypoint the splats lane published; a JSON array. Unset uses ["splatpipe"].
  command: []
  args: []
  # The RWX class the fallback tiers' shared output volume is made from. Empty is the cluster's
  # default. A TrainingDeployment provisions its own storage and ignores this.
  storageClass: ""
  # Empty is discovered from the nodes — nvidia.com/gpu on gh200-1.
  gpuResource: ""

# Let the editor count free GPUs across the cluster, to size a splat run's worker fan-out.
#
# This is a CLUSTER-scoped read of nodes and of pods in every namespace, which is a wider grant
# than anything else this chart asks for — so it is opt-in. Off, the editor says it could not ask
# rather than reporting zero, and the worker count is whatever the person chose.
gpuVisibility: false
